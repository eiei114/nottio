[package]
name = "nottio"
version = "0.1.0"
edition = "2021"
description = "FigJam-like sticky board for Windows and macOS: paste notes, draw shapes, connect them with arrows."
publish = false

[dependencies]
# This app uses the `gpui-pre` snapshot family required by gpui-whiteboard.
#
# Every gpui-pre release is a DIFFERENT zed snapshot, so the app and every gpui
# crate in the tree must resolve to the SAME version (one gpui graph). Keep the
# exact pins below in step and let Cargo.lock hold them.
# gpui-whiteboard 0.5.1 requires `gpui-pre` 0.3 -> 0.3.9 is the shared target.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui-whiteboard = { path = "vendor/gpui-whiteboard" }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "ico", "pnm"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Compile the embedded Metal source on launch. Builds need the Apple SDK, not
# the separate Xcode Metal compiler/toolchain. Keep the same pinned GPUI graph.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["runtime_shaders"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }

[build-dependencies]
embed-resource = "=3.0.12"

[workspace]
members = ["vendor/gpui-whiteboard"]
default-members = [".", "vendor/gpui-whiteboard"]

[profile.release]
lto = "thin"
codegen-units = 1
